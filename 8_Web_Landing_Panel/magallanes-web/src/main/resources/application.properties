# =====================================================================
# Configuración de la aplicación (Spring Boot)
#
# Los datos que CAMBIAN EN CADA COMPUTADORA (servidor, puerto, base, usuario, contraseña,
# MongoDB) NO se escriben aquí: se leen del archivo .env que está en la carpeta magallanes-web.
#   - .env          → valores reales de su PC (NO se sube a GitHub: está en .gitignore)
#   - .env.example  → plantilla que sí se sube; se copia como .env y se ajusta
#
# Sintaxis ${VARIABLE:valor_por_defecto}: si el .env (o una variable de entorno de Windows)
# define VARIABLE se usa ese valor; si no, el valor por defecto que va después de los dos puntos.
# =====================================================================

# Orden de lectura (lo de la derecha gana si una clave se repite):
#   1) .env.example  → valores de ejemplo del equipo (puerto 1433, base, usuario de la app)
#   2) .env          → SUS valores (si lo creó); por ejemplo DB_PORT=55448 en una instancia con nombre
# "optional:" = si el archivo no existe, la app arranca igual.
# MagallanesWebApplication.main lee .env.example y .env de la carpeta magallanes-web (sin importar desde dónde
# se ejecute) y los deja como ${CLAVE}. La línea siguiente es un respaldo con rutas relativas.
spring.config.import=optional:file:.env.example[.properties],optional:file:magallanes-web/.env.example[.properties],optional:file:.env[.properties],optional:file:magallanes-web/.env[.properties]

# ---------------- SQL Server (base relacional) ----------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:magallanes_montero_prueba36};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:app_magallanes}
spring.datasource.password=${DB_PASSWORD:}
# Pool de conexiones HikariCP: reutiliza conexiones abiertas en vez de abrir una por cada petición.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ---------------- MongoDB (base no relacional) ----------------
# serverSelectionTimeoutMS: si MongoDB no está encendido, se avisa en 2 s en vez de esperar 30 s.
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/magallanes_montero?serverSelectionTimeoutMS=2000}

# ---------------- Servidor web ----------------
server.port=${APP_PORT:8080}
server.servlet.session.timeout=60m
spring.jackson.time-zone=America/Lima

# Recursos estáticos: el navegador siempre pregunta si cambiaron (evita ver JS/CSS antiguos tras actualizar)
spring.web.resources.cache.cachecontrol.no-cache=true
